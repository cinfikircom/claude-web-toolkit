name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Windows'ta da Git Bash: tüm adımlar tek sözdizimiyle çalışır
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check (pure-Node tools)
        run: |
          node --check plugins/seo-geo-optimizer/tools/seo-os-state-lib.js
          node --check plugins/seo-geo-optimizer/tools/seo-os-tracker.js
          node --check plugins/seo-geo-optimizer/tools/seo-os-sync.js
          node --check plugins/seo-geo-optimizer/tools/seo-os-dashboard.js
          node --check plugins/seo-geo-optimizer/tools/seo-os-probe.js
          node --check plugins/seo-geo-optimizer/tools/seo-os-doctor.js
          node --check plugins/seo-geo-optimizer/tools/seo-os-sitecheck.js
          node --check plugins/seo-geo-optimizer/tools/seo-os-indexnow.js
          node --check plugins/seo-geo-optimizer/tools/seo-os-gsc.js
          node --check seo-os-validation-suite/seo-os-scorer.js
          node --check seo-os-validation-suite/golden-tests/check-regression.js
          node --check seo-os-validation-suite/golden-tests/check-integrity.js
          node --check seo-os-validation-suite/golden-tests/check-delta.js
          node --check seo-os-validation-suite/harness/run-agent-harness.js
          node --check seo-os-validation-suite/harness/grade-lib.js
          node --check seo-os-validation-suite/harness/judge-consistency.js
          node --check seo-os-validation-suite/lighthouse-runner.js
          node --check seo-os-validation-suite/delta-report.js

      - name: JSON files parse (all tracked .json)
        run: |
          git ls-files '*.json' | while read -r f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" \
              && echo "OK  $f" || { echo "FAIL $f"; exit 1; }
          done

      - name: Version sync (plugin.json == SKILL.md == marketplace.json == CHANGELOG)
        run: |
          PV=$(node -p "require('./plugins/seo-geo-optimizer/.claude-plugin/plugin.json').version")
          SV=$(grep -m1 '^version:' plugins/seo-geo-optimizer/skills/seo-geo-audit/SKILL.md | awk '{print $2}')
          MV=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          CV=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "plugin.json=$PV  SKILL.md=$SV  marketplace.json=$MV  CHANGELOG=$CV"
          [ "$PV" = "$SV" ] && [ "$PV" = "$MV" ] && [ "$PV" = "$CV" ] || { echo "Version mismatch!"; exit 1; }

      - name: Deterministic suite tests (integrity + delta-report + golden regression)
        run: |
          cd seo-os-validation-suite
          npm test

      # smoke'lar repo-göreli .ci-tmp altında koşar: /tmp yok, mutlak yol yok —
      # aynı adımlar Windows (Git Bash) + Node'da da birebir çalışır
      - name: Dashboard smoke (template state -> --json + HTML)
        run: |
          mkdir -p .ci-tmp/dash-smoke/.seo-os
          sed 's/{SITE_ADI}/ci-smoke/; s/{ISO8601}/2026-01-01T00:00:00Z/' \
            plugins/seo-geo-optimizer/skills/seo-geo-audit/templates/seo-os-state.template.json \
            > .ci-tmp/dash-smoke/.seo-os/seo-os-state.json
          cd .ci-tmp/dash-smoke
          node ../../plugins/seo-geo-optimizer/tools/seo-os-dashboard.js --json | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              const j=JSON.parse(d);
              if (j.project!=='ci-smoke' || j.progress.total!==14) { console.error('smoke FAIL', j); process.exit(1); }
              console.log('dashboard smoke OK');
            })"
          node ../../plugins/seo-geo-optimizer/tools/seo-os-dashboard.js
          grep -q "Görev Günlüğü" .seo-os/dashboard.html && echo "dashboard HTML OK"

      - name: PSI-parse + probe + fleet smoke (deterministic, no network)
        run: |
          cat > .ci-tmp/psi-mock.json <<'EOF'
          {
            "lighthouseResult": {
              "finalUrl": "https://ci.example",
              "audits": {
                "largest-contentful-paint": { "numericValue": 2340 },
                "cumulative-layout-shift": { "numericValue": 0.055 },
                "server-response-time": { "numericValue": 480 },
                "total-blocking-time": { "numericValue": 190 }
              },
              "categories": { "performance": { "score": 0.87 } }
            },
            "loadingExperience": { "metrics": { "INTERACTION_TO_NEXT_PAINT": { "percentile": 210 } } }
          }
          EOF
          cd .ci-tmp/dash-smoke
          node ../../plugins/seo-geo-optimizer/tools/seo-os-dashboard.js --measure --psi-mock=../psi-mock.json
          node -e "
            const r=JSON.parse(require('fs').readFileSync('.seo-os/cwv-report.json','utf8'));
            if (r.LCP_s!==2.3 || r.INP_ms!==210 || r.source!=='psi-lab+crux') { console.error('PSI parse FAIL', r); process.exit(1); }
            console.log('PSI parse OK');"
          node ../../plugins/seo-geo-optimizer/tools/seo-os-probe.js --site=ci.example --keywords="test sorgusu" --dry-run
          node ../../plugins/seo-geo-optimizer/tools/seo-os-dashboard.js --fleet
          node -e "
            const os=require('os'),p=require('path'),fs=require('fs');
            const f=p.join(os.homedir(),'.seo-os','fleet.html');
            if (!fs.readFileSync(f,'utf8').includes('ci-smoke')) { console.error('fleet FAIL'); process.exit(1); }
            console.log('fleet smoke OK');"

      - name: Doctor + sitecheck smoke (deterministic, no network)
        run: |
          mkdir -p .ci-tmp/broken/.seo-os
          echo '{ "mode": "TURBO", "phases": { "A": { "status": "done" } } }' > .ci-tmp/broken/.seo-os/seo-os-state.json
          cd .ci-tmp/broken
          if node ../../plugins/seo-geo-optimizer/tools/seo-os-doctor.js; then echo "doctor should have failed"; exit 1; fi
          node ../../plugins/seo-geo-optimizer/tools/seo-os-doctor.js --repair
          node ../../plugins/seo-geo-optimizer/tools/seo-os-doctor.js && echo "doctor repair OK"
          node ../../plugins/seo-geo-optimizer/tools/seo-os-sitecheck.js \
            --dir=../../seo-os-validation-suite/fixtures/cloudflare-pages-broken-site
          node -e "
            const r=JSON.parse(require('fs').readFileSync('.seo-os/sitecheck-report.json','utf8'));
            if (r.pagesScanned < 2 || !Array.isArray(r.orphans) || !Array.isArray(r.imagesNoAlt)) { console.error('sitecheck FAIL', r); process.exit(1); }
            console.log('sitecheck smoke OK —', r.pagesScanned, 'pages');"

      - name: IndexNow + GSC smoke (deterministic, no network)
        run: |
          mkdir -p .ci-tmp/inx/public && cd .ci-tmp/inx
          node ../../plugins/seo-geo-optimizer/tools/seo-os-indexnow.js --setup --site=https://ci.example --public=public
          KEY=$(node -pe "require('./.seo-os/indexnow.json').key")
          test -f "public/$KEY.txt" && echo "indexnow setup OK"
          printf 'https://ci.example/a\nhttps://ci.example/b\n' > urls.txt
          node ../../plugins/seo-geo-optimizer/tools/seo-os-indexnow.js --list=urls.txt --dry-run | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              const p=JSON.parse(d);
              if (p.host!=='ci.example' || p.urlList.length!==2) { console.error('indexnow FAIL', p); process.exit(1); }
              console.log('indexnow dry-run OK');
            })"
          cat > gsc-mock.json <<'EOF'
          { "rows": [
            { "keys": ["2026-01-01"], "clicks": 10, "impressions": 100, "ctr": 0.1, "position": 12 },
            { "keys": ["2026-01-02"], "clicks": 30, "impressions": 300, "ctr": 0.1, "position": 8 }
          ]}
          EOF
          node ../../plugins/seo-geo-optimizer/tools/seo-os-gsc.js --gsc-mock=gsc-mock.json
          node -e "
            const r=JSON.parse(require('fs').readFileSync('.seo-os/gsc-report.json','utf8'));
            if (r.totals.clicks!==40 || r.totals.impressions!==400 || r.totals.position!==9) { console.error('gsc FAIL', r.totals); process.exit(1); }
            console.log('gsc smoke OK —', JSON.stringify(r.totals));"
